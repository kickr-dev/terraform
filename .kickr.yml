# Kickr configuration file (https://github.com/kickr-dev/kickr)
# yaml-language-server: $schema=https://raw.githubusercontent.com/kickr-dev/kickr/beta/.schemas/kickr.v1.schema.json
version: 1
build_tool: just
exclude:
  - shell
gitlab:
  options:
    - kickr
license: mit
maintainers:
  - name: u.kilianpaquier
modules:
  - path: modules/git
    terraform:
      apply: manual
      engine: tofu
      environments:
        - production
platform: gitlab
